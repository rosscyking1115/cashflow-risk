# Render Blueprint — API + web dashboard + managed Postgres.
#
# NOT CURRENTLY DEPLOYED. The hosted demo was retired in July 2026; see
# docs/adr/0003-hosted-demo-backend-stays-down.md for why. This file is kept
# because it is a working description of how the project was deployed and a
# starting point for anyone who wants to host it — not because anything is
# running from it.
#
# Read this before redeploying: `cashflow-db` below is a FREE Render Postgres,
# and free Render databases expire 30 days after creation. That expiry is what
# ended the original deployment — the API runs `alembic upgrade head` on start,
# so a dead database stops it booting at all. Point DATABASE_URL at a database
# that does not expire. The engine now refuses to start in production without
# one rather than silently falling back to SQLite.
#
# Deploy: push this repo to GitHub, then in Render choose "New > Blueprint" and
# point it at the repo. Render provisions all three from this file. Two values
# must be set by hand after the first deploy (their URLs aren't known until the
# services exist) — see docs/deployment.md.

databases:
  - name: cashflow-db
    plan: free
    databaseName: cashflow
    user: cashflow

services:
  # FastAPI engine (Docker). Runs `alembic upgrade head` on start.
  - type: web
    name: cashflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CASHFLOW_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-db
          property: connectionString
      - key: CASHFLOW_JWT_SECRET
        generateValue: true
      # Trust the dashboard's Render domain without hard-coding its exact name.
      - key: CASHFLOW_ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.onrender\\.com"
      # Clerk: set both to enable authenticated uploads (see docs/deployment.md).
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      # Companies House REST API key — enables customer risk enrichment.
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      # Sentry error monitoring (optional). PII-scrubbed: no bodies, no locals,
      # no financial fields — see src/cashflow_risk/observability.py.
      - key: SENTRY_DSN
        sync: false

  # Daily maintenance: retention purge + Companies House signal refresh (Docker,
  # same image as the API). Overrides the image CMD — it must NOT run migrations
  # (that is the API's job on deploy). One cron does both tasks: cron services
  # are billed per service. Note: Render Cron Jobs are not offered on the free
  # tier, so this runs on starter. Schedule is UTC.
  - type: cron
    name: cashflow-daily-maintenance
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    schedule: "0 3 * * *"
    dockerCommand: uv run python scripts/daily_maintenance.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-db
          property: connectionString
      # Companies House REST API key — enables the signal refresh step.
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      # Auto-purge window for stored results (privacy notice: 24 months).
      - key: CASHFLOW_RETENTION_DAYS
        value: "730"

  # Next.js dashboard (Node).
  - type: web
    name: cashflow-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Set to the API service URL after first deploy, then redeploy (clear
      # build cache) so Next inlines it. e.g. https://cashflow-api.onrender.com
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      # Clerk: set both to enable sign-in + uploads (see docs/deployment.md).
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
