name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes supersede in-flight runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy strict)
        run: uv run mypy
      - name: Test
        run: uv run pytest
      # The API runs `alembic upgrade head` on deploy — prove every migration
      # applies from an empty database, and that the models match the migrations
      # (a model change with no migration would break the next deploy).
      - name: Migrations apply and match models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (Next.js)
        run: npm run build
