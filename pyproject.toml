[project]
name = "cashflow-risk"
version = "0.1.0"
description = "Cashflow Risk Intelligence — late-payment risk + 13-week cash runway for UK SMEs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "scikit-learn>=1.9.0",
    "sentry-sdk[fastapi]>=2.64.0",
]

[project.urls]
Repository = "https://github.com/rosscyking1115/cashflow-risk"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-python-dateutil>=2.9",
    { include-group = "train" },
]
# Training-time lane (PLAN §0.1: MLflow is tracking-only and lives OUTSIDE the
# SaaS runtime — the Docker image installs with --no-dev and never gets this).
train = [
    "lightgbm>=4",
    "mlflow-skinny>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashflow_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["cashflow_risk"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true
